# site properties and page defaults
title: Medical Machine Learning Lab
subtitle: 
description: Clinical decisions are made with incomplete, noisy, and heterogeneous data under uncertainty. At M2L Lab, we develop AI methods that support clinicians with reliable, interpretable, and scalable intelligence. Our research focuses on scalable and efficient learning across medical modalities, interpretability and reasoning, and robustness and human-centeredness, aiming for reliable and trustworthy AI in medicine. 
header: 
footer: 
proofer: false

